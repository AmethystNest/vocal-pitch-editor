name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and DSP regression checks
        run: npm run qa
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run compact iPhone browser E2E
        env:
          BROWSER: mobile-mini
        run: python tests/browser_e2e.py


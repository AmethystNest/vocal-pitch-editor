name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and DSP regression checks
        run: npm run qa
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install -r tests/requirements-browser.txt
      - name: Install FFmpeg for compressed-audio tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Install Chromium and WebKit with system dependencies
        run: python -m playwright install --with-deps chromium webkit
      - name: Run compact iPhone browser E2E
        env:
          BROWSER: mobile-mini
        run: python tests/browser_e2e.py
      - name: Run long-track iPhone memory E2E
        env:
          BROWSER: mobile-long
        run: python tests/browser_e2e.py
      - name: Run audio-session replacement E2E
        env:
          BROWSER: mobile-cycle
        run: python tests/browser_e2e.py
      - name: Run WebKit mobile shell E2E
        env:
          BROWSER: webkit
        run: python tests/browser_e2e.py
      - name: Run MP3 mobile E2E
        env:
          BROWSER: mobile-mp3
        run: python tests/browser_e2e.py
      - name: Run M4A mobile E2E
        env:
          BROWSER: mobile-m4a
        run: python tests/browser_e2e.py
      - name: Run AAC mobile E2E
        env:
          BROWSER: mobile-aac
        run: python tests/browser_e2e.py
      - name: Run mobile share-sheet E2E
        env:
          BROWSER: mobile-share-success
        run: python tests/browser_e2e.py
      - name: Run offline PWA E2E
        env:
          BROWSER: pwa-offline
        run: python tests/browser_e2e.py

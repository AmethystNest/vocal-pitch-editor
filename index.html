<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ボーカルピッチエディタ</title>
<meta name="description" content="スマホ・PC対応。ボーカルのピッチ解析・手動補正・参考音源比較・WAV書き出しができるブラウザ型ピッチエディタ">
<meta name="theme-color" content="#14161c">
<meta name="application-name" content="ボーカルピッチエディタ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ピッチエディタ">
<meta property="og:type" content="website">
<meta property="og:title" content="ボーカルピッチエディタ">
<meta property="og:description" content="スマホ・PC対応のボーカルピッチ補正・編集ツール">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root {
    --bg: #14161c;
    --panel: #1e212a;
    --panel2: #262a35;
    --accent: #5b8cff;
    --accent2: #7fe0c0;
    --note-block: #f5a742;
    --note-block-bright: #ffc36e;
    --warn: #ff6b6b;
    --text: #e8e9ee;
    --sub: #9aa0ad;
    --key-white: #20232c;
    --key-black: #191b22;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; display: flex; flex-direction: column; }

  input[type=file] { display: none; }

  /* ---------- loading screen (overlay while a file is being analyzed) ---------- */
  #loadingScreen {
    position: absolute; inset: 0; z-index: 40; background: var(--bg);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid #333844; border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingScreen .status { color: var(--sub); font-size: 14px; padding: 0 24px; text-align: center; }

  /* ---------- editor screen (shown from the start; canvas has its own empty-state prompt) ---------- */
  #editorScreen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--panel);
    border-bottom: 1px solid #2a2e38; flex: 0 0 auto;
    padding-top: max(6px, env(safe-area-inset-top));
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  #topbar > * { flex-shrink: 0; }
  .iconBtn {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px;
    width: 54px; height: 50px; min-width: 54px; border-radius: 10px;
    background: var(--panel2); color: var(--text); border: none; font-size: 17px;
    touch-action: manipulation;
  }
  .iconBtn .toolLabel { font-size: 9px; line-height: 1; color: var(--sub); font-weight: 600; letter-spacing: .01em; }
  .iconBtn.accent .toolLabel { color: rgba(255,255,255,.88); }
  .iconBtn:active { filter: brightness(1.3); }
  .iconBtn.accent { background: var(--accent); }
  .iconBtn.wide { width: auto; min-width: 62px; padding: 0 12px; gap: 2px; font-size: 14px; font-weight: 600; }
  .iconBtn:disabled { opacity: 0.4; }
  .iconBtn.armed { background: var(--warn); }
  .modeGroup { display: flex; background: var(--panel2); border-radius: 10px; padding: 2px; }
  .modeBtn {
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px;
    width: 48px; height: 46px; border-radius: 8px; border: none;
    background: transparent; color: var(--sub); font-size: 15px; touch-action: manipulation;
  }
  .modeBtn .toolLabel { font-size: 9px; line-height: 1; font-weight: 600; }
  .modeBtn.active { background: var(--accent); color: white; }
  .playSegBtn {
    width: 100%; height: 32px; border-radius: 8px; border: none; margin-bottom: 6px;
    background: var(--accent); color: white; font-size: 12px; font-weight: 600; touch-action: manipulation;
  }
  #topbar .spacer { flex: 1; }
  #fileNameLabel { font-size: 12px; color: var(--sub); max-width: 22vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #rollWrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); margin-bottom: env(safe-area-inset-bottom, 0px); }
  #rollCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* floating inspector */
  #inspector {
    position: absolute; right: 8px; top: 8px; display: none;
    background: rgba(30,33,42,0.96); border: 1px solid #343a48; border-radius: 12px;
    padding: 8px 10px; min-width: 168px; backdrop-filter: blur(4px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  #inspector .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  #inspector .noteName { font-size: 15px; font-weight: 700; color: var(--accent2); }
  #inspector .closeX { width: 26px; height: 26px; border-radius: 8px; background: var(--panel2); border: none; color: var(--sub); font-size: 13px; }
  #inspector .offsetLine { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  #inspector .rowBtns { display: flex; gap: 4px; margin-bottom: 6px; }
  #inspector .rowBtns button {
    flex: 1; height: 30px; border-radius: 8px; border: none; background: var(--panel2);
    color: var(--text); font-size: 11px; touch-action: manipulation;
  }
  #inspector .rowBtns button:active { filter: brightness(1.4); }
  #inspector .resetBtn {
    width: 100%; height: 30px; border-radius: 8px; border: none;
    background: #33323f; color: var(--warn); font-size: 12px; touch-action: manipulation;
  }

  #toast {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(20,22,28,0.92); border: 1px solid #343a48; border-radius: 10px;
    padding: 8px 14px; font-size: 12px; color: var(--sub); display: none; pointer-events: none;
  }

  /* ---------- clear first-run upload surface ---------- */
  #emptyUpload {
    position: absolute; inset: 0; z-index: 8; display: flex;
    align-items: center; justify-content: center; padding: 24px; pointer-events: none;
  }
  #emptyUpload.hidden { display: none; }
  #emptyUploadCard {
    width: min(92vw, 420px); padding: 24px 20px 20px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(38,42,53,.98), rgba(30,33,42,.98));
    border: 1px solid #394052; box-shadow: 0 14px 38px rgba(0,0,0,.35);
    text-align: center; pointer-events: auto;
  }
  #emptyUploadIcon {
    width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 20px;
    display: grid; place-items: center; background: rgba(91,140,255,.14);
    border: 1px solid rgba(91,140,255,.35); font-size: 30px;
  }
  #emptyUploadTitle { font-size: 18px; font-weight: 750; margin-bottom: 6px; }
  #emptyUploadText { color: var(--sub); font-size: 12px; line-height: 1.6; margin-bottom: 16px; }
  #emptyUploadBtn {
    width: 100%; min-height: 50px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 750;
    touch-action: manipulation;
  }
  #emptyUploadHint { color: #707786; font-size: 10px; margin-top: 10px; }

  /* ---------- editing guidance / mobile ergonomics ---------- */
  #interactionGuide {
    flex: 0 0 auto; min-height: 28px; display: flex; align-items: center; gap: 8px;
    padding: 4px 10px; background: #181b22; border-bottom: 1px solid #262b35;
    color: var(--sub); font-size: 11px; line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #interactionGuide .guideMode { color: var(--accent2); font-weight: 750; flex: 0 0 auto; }
  #interactionGuide .guideText { overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 700px) {
    #topbar { gap: 5px; padding-left: 6px; padding-right: 6px; }
    .iconBtn { width: 52px; min-width: 52px; height: 48px; border-radius: 9px; }
    .modeBtn { width: 47px; height: 44px; }
    #fileNameLabel { display: none; }
    #inspector {
      position: absolute; left: 8px; right: 8px; top: auto;
      bottom: max(8px, env(safe-area-inset-bottom));
      min-width: 0; padding: 10px 12px 12px; border-radius: 16px;
      background: rgba(30,33,42,.985); backdrop-filter: blur(10px);
      box-shadow: 0 -8px 28px rgba(0,0,0,.34);
    }
    #inspector .head { margin-bottom: 4px; }
    #inspector .noteName { font-size: 17px; }
    #inspector .offsetLine { margin-bottom: 8px; }
    #inspector .rowBtns { gap: 5px; }
    #inspector .rowBtns button, #inspector .resetBtn, .playSegBtn { min-height: 38px; font-size: 12px; }
    #toast { bottom: calc(14px + env(safe-area-inset-bottom)); }
  }

  /* ---------- pitch inspector v2 ---------- */
  .pitchSummary { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:7px 0 8px; }
  .pitchStat { background:#171a21; border:1px solid #2b303b; border-radius:9px; padding:7px 6px; text-align:center; min-width:0; }
  .pitchStat .k { display:block; color:#8f98a8; font-size:9px; margin-bottom:2px; }
  .pitchStat .v { display:block; color:#eef1f7; font-size:12px; font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pitchStat.after .v { color:#9fc0ff; }
  .pitchStat.target .v { color:#ffe08a; }
  .inspActions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:6px 0; }
  .inspActionBtn { min-height:36px; border:1px solid #3b4352; border-radius:8px; background:#252a34; color:#eef1f7; font-size:11px; font-weight:700; }
  .inspActionBtn:active { transform:scale(.985); }
  .inspActionBtn.primary { background:#2d4d8c; border-color:#4f76c7; }
  .inspActionBtn:disabled { opacity:.45; }
  .inspLegend { display:flex; align-items:center; gap:10px; margin:3px 0 7px; color:#8f98a8; font-size:9px; }
  .inspLegend span { display:flex; align-items:center; gap:4px; }
  .legendLine { width:18px; height:0; border-top:2px solid rgba(255,255,255,.82); }
  .legendLine.before { border-top-style:dashed; border-top-color:rgba(126,138,158,.9); }
  @media (max-width:700px) {
    .pitchSummary { gap:5px; margin-top:5px; }
    .pitchStat { padding:6px 4px; }
    .pitchStat .v { font-size:11px; }
    .inspActions { gap:5px; }
    .inspActionBtn { min-height:38px; }
  }

  /* ---------- correction strength v3 ---------- */
  .strengthPanel {
    margin: 7px 0 8px;
    padding: 8px;
    border: 1px solid #343b49;
    border-radius: 10px;
    background: #1c2028;
  }
  .strengthHead {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:7px; font-size:10px; color:#a7afbd;
  }
  .strengthValue {
    color:#f1f4fb; font-weight:800; font-size:12px;
    font-variant-numeric: tabular-nums;
  }
  .strengthPresets {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:5px;
  }
  .strengthPreset {
    min-height:31px; padding:4px 3px; border-radius:7px;
    border:1px solid #394150; background:#252a34; color:#c9d0dc;
    font-size:9px; font-weight:700;
  }
  .strengthPreset.active {
    background:#2d4d8c; border-color:#5b8cff; color:#fff;
  }
  .strengthRange {
    width:100%; margin:8px 0 2px; accent-color:#5b8cff;
  }
  .strengthHint {
    font-size:9px; line-height:1.35; color:#7f8999;
  }

  /* v4: details no longer pop up on first note tap */
  #inspector { display:none; opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .14s ease, transform .14s ease; }
  #inspector.show { display:block; opacity:1; pointer-events:auto; transform:translateY(0); }

  /* Mobile tap reliability: iPhone Safari + Android Chrome */
  #pitchCanvas, canvas {
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="app">

  <input type="file" id="fileInput" accept=".wav,.mp3,.m4a,.aac,audio/wav,audio/x-wav,audio/mpeg,audio/mp4,audio/aac">
  <input type="file" id="refFileInput" accept=".wav,.mp3,.m4a,.aac,audio/wav,audio/x-wav,audio/mpeg,audio/mp4,audio/aac">

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="status" id="loadingStatus">解析中...</div>
  </div>

  <div id="editorScreen">
    <div id="topbar">
      <button class="iconBtn" id="backBtn" title="音声ファイルを開く">📁<span class="toolLabel">音源</span></button>
      <button class="iconBtn" id="fullscreenBtn" title="Androidで全画面表示" hidden>⛶<span class="toolLabel">全画面</span></button>
      <button class="iconBtn accent" id="playBtn" title="再生/一時停止" disabled>▶<span class="toolLabel">再生</span></button>
      <button class="iconBtn" id="zoomOutBtn" title="縮小" disabled>−<span class="toolLabel">縮小</span></button>
      <button class="iconBtn" id="zoomInBtn" title="拡大" disabled>＋<span class="toolLabel">拡大</span></button>
      <button class="iconBtn" id="fitAllBtn" title="検出した譜面全体を表示" disabled>↔<span class="toolLabel">全体</span></button>
      <div class="modeGroup" id="modeGroup">
        <button class="modeBtn active" id="modeNoteBtn" title="ノートツール:音符ごとドラッグ">🎵<span class="toolLabel">ノート</span></button>
        <button class="modeBtn" id="modeLineBtn" title="ラインツール:ピッチカーブを自由に描く">〰️<span class="toolLabel">ライン</span></button>
      </div>
      <button class="iconBtn" id="splitBtn" title="分割:タップした位置でノートを2つに分ける" disabled>✂️<span class="toolLabel">分割</span></button>
      <button class="iconBtn" id="autoPreviewBtn" title="編集のたびに自動で試聴(タップでオン/オフ)">🔈<span class="toolLabel">自動試聴</span></button>
      <button class="iconBtn" id="undoBtn" title="1つ前の編集に戻る（最大10回）" disabled>↶<span class="toolLabel">戻る</span></button>
      <button class="iconBtn" id="resetAllBtn" title="全て元に戻す" disabled>↺<span class="toolLabel">リセット</span></button>
      <button class="iconBtn" id="autoCorrectBtn" title="検出した全ノートを現在の補正強度で最寄りの音程へ寄せる" disabled>✨<span class="toolLabel" id="autoCorrectLabel">自動補正 60%</span></button>
      <button class="iconBtn" id="refBtn" title="リファレンス(お手本)音源を読み込む" disabled>🎯<span class="toolLabel">お手本</span></button>
      <button class="iconBtn" id="refPlayBtn" title="リファレンスを再生(現在の再生位置に対応する箇所から)" disabled>🎯▶<span class="toolLabel">お手本再生</span></button>
      <button class="iconBtn wide" id="applyAllBtn" title="すべての候補を適用" disabled>✓<span class="toolLabel">候補適用</span></button>
      <div class="spacer"></div>
      <span id="fileNameLabel"></span>
      <button class="iconBtn wide accent" id="exportBtn" title="24-bit WAVで書き出し" disabled>⬇<span class="toolLabel">書き出し</span></button>
    </div>
    <div id="interactionGuide">
      <span class="guideMode" id="guideMode">ノート</span>
      <span class="guideText" id="guideText">ノートを上下ドラッグで半音移動・タップで微調整</span>
    </div>
    <div id="rollWrap">
      <div id="emptyUpload">
        <div id="emptyUploadCard">
          <div id="emptyUploadIcon">🎙️</div>
          <div id="emptyUploadTitle">ボーカル音源を読み込む</div>
          <div id="emptyUploadText">ピッチを解析して、ノートを直接動かして補正できます。<br>WAV / MP3 / M4A / AAC 対応</div>
          <button id="emptyUploadBtn" type="button">ファイルを選択</button>
          <div id="emptyUploadHint">音源は端末内で処理されます</div>
        </div>
      </div>
      <canvas id="rollCanvas"></canvas>
      <div id="inspector">
        <div class="head"><span class="noteName" id="inspNote">C4</span><button class="closeX" id="inspClose">×</button></div>
        <div class="offsetLine" id="inspOffset">±0¢</div>
        <div class="pitchSummary">
          <div class="pitchStat"><span class="k">元の中心</span><span class="v" id="inspBefore">--</span></div>
          <div class="pitchStat after"><span class="k">補正後</span><span class="v" id="inspAfter">--</span></div>
          <div class="pitchStat target"><span class="k">目標</span><span class="v" id="inspTarget">--</span></div>
        </div>
        <div class="inspLegend"><span><i class="legendLine before"></i>補正前</span><span><i class="legendLine"></i>補正後</span></div>
        <div class="strengthPanel">
          <div class="strengthHead"><span>補正強度</span><span class="strengthValue" id="strengthValue">60%</span></div>
          <div class="strengthPresets" id="strengthPresets">
            <button class="strengthPreset" data-strength="30">自然 30</button>
            <button class="strengthPreset active" data-strength="60">標準 60</button>
            <button class="strengthPreset" data-strength="85">強め 85</button>
            <button class="strengthPreset" data-strength="100">完全 100</button>
          </div>
          <input class="strengthRange" id="strengthRange" type="range" min="0" max="100" step="1" value="60" aria-label="補正強度">
          <div class="strengthHint">ビブラートや細かな揺れは残したまま、ノート中心だけを目標へ寄せます。</div>
        </div>
        <button class="playSegBtn" id="inspPlay">▶ この音を再生</button>
        <div class="inspActions">
          <button class="inspActionBtn primary" id="inspCenter">中心へ補正</button>
          <button class="inspActionBtn" id="inspRef">お手本候補へ補正</button>
        </div>
        <div class="rowBtns">
          <button data-d="-50">-50¢</button><button data-d="-10">-10¢</button><button data-d="-1">-1¢</button>
          <button data-d="1">+1¢</button><button data-d="10">+10¢</button><button data-d="50">+50¢</button>
        </div>
        <button class="resetBtn" id="inspReset">このノートをリセット</button>
      </div>
      <div id="toast"></div>
    </div>
  </div>

</div>

<script id="engine-src">
/**
 * Pitch editing core engine: YIN pitch detection, note segmentation,
 * and a grain-schedule TD-PSOLA resynthesizer driven by per-segment
 * manual pitch shifts (instead of auto key-snapping).
 *
 * Ported/adapted from the validated vocal_corrector_js prototype
 * (YIN: 3.2 cent accuracy vs reference; PSOLA: 3.1 cent post-correction
 * accuracy). The PSOLA ratio computation is swapped from "snap to nearest
 * scale note" to "apply the shift of whichever user-edited segment covers
 * this instant", which is a minimal change to the validated resynthesis
 * path. Grain placement is computed once (from the shared mono analysis)
 * and replayed per channel so stereo images don't comb-filter.
 */
(function (root) {
  'use strict';

  // ============================================================
  // YIN pitch detection
  // ============================================================
  function differenceFunction(frame, maxLag) {
    const n = frame.length;
    const df = new Float64Array(maxLag);
    const energy = new Float64Array(n + 1);
    for (let i = 0; i < n; i++) energy[i + 1] = energy[i] + frame[i] * frame[i];
    const totalEnergy = energy[n];
    for (let tau = 1; tau < maxLag; tau++) {
      let acf = 0;
      const limit = n - tau;
      for (let i = 0; i < limit; i++) acf += frame[i] * frame[i + tau];
      const e = tau < n ? totalEnergy - energy[tau] : 0;
      const eShift = tau < n ? energy[n - tau] : 0;
      df[tau] = e + eShift - 2 * acf;
    }
    df[0] = 0;
    return df;
  }

  function cumulativeMeanNormalizedDifference(df) {
    const cmndf = new Float64Array(df.length);
    cmndf[0] = 1.0;
    let runningSum = 0;
    for (let tau = 1; tau < df.length; tau++) {
      runningSum += df[tau];
      cmndf[tau] = runningSum > 0 ? (df[tau] * tau) / runningSum : 1.0;
    }
    return cmndf;
  }

  function absoluteThreshold(cmndf, threshold, minLag) {
    for (let tau = minLag; tau < cmndf.length - 1; tau++) {
      if (cmndf[tau] < threshold) {
        while (tau + 1 < cmndf.length && cmndf[tau + 1] < cmndf[tau]) tau++;
        return tau;
      }
    }
    return -1;
  }

  function parabolicInterpolation(cmndf, tau) {
    if (tau <= 0 || tau >= cmndf.length - 1) return tau;
    const s0 = cmndf[tau - 1], s1 = cmndf[tau], s2 = cmndf[tau + 1];
    const denom = s0 - 2 * s1 + s2;
    if (denom === 0) return tau;
    return tau + 0.5 * (s0 - s2) / denom;
  }

  function yinPitchTrack(signal, sr, opts) {
    opts = opts || {};
    const frameSize = opts.frameSize || 2048;
    const hopSize = opts.hopSize || 512;
    const fmin = opts.fmin || 70;
    const fmax = opts.fmax || 1000;
    const threshold = opts.threshold || 0.15;
    const minLag = Math.max(2, Math.floor(sr / fmax));
    const maxLag = Math.min(Math.floor(frameSize / 2), Math.floor(sr / fmin) + 1);
    const n = signal.length;
    const nFrames = Math.max(0, 1 + Math.floor((n - frameSize) / hopSize));
    const f0s = new Float64Array(nFrames);
    const voiced = new Uint8Array(nFrames);
    const times = new Float64Array(nFrames);
    const clarity = new Float64Array(nFrames);
    const window = new Float64Array(frameSize);
    for (let i = 0; i < frameSize; i++) window[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (frameSize - 1));
    const frameW = new Float64Array(frameSize);
    for (let i = 0; i < nFrames; i++) {
      const start = i * hopSize;
      times[i] = (start + frameSize / 2) / sr;
      let maxAbs = 0;
      for (let j = 0; j < frameSize; j++) {
        const v = signal[start + j] * window[j];
        frameW[j] = v;
        const av = Math.abs(v);
        if (av > maxAbs) maxAbs = av;
      }
      if (maxAbs < 1e-6) continue;
      const df = differenceFunction(frameW, maxLag);
      const cmndf = cumulativeMeanNormalizedDifference(df);
      const tau = absoluteThreshold(cmndf, threshold, minLag);
      if (tau === -1) continue;
      clarity[i] = 1 - cmndf[tau];
      const tauRefined = parabolicInterpolation(cmndf, tau);
      if (tauRefined <= 0) continue;
      const f0 = sr / tauRefined;
      if (f0 >= fmin && f0 <= fmax) { f0s[i] = f0; voiced[i] = 1; }
    }
    return { f0s, voiced, times, clarity, hopSize, frameSize };
  }

  // ============================================================
  // Note / pitch conversion helpers
  // ============================================================
  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  function freqToMidi(f) { return 69 + 12 * Math.log2(f / 440.0); }
  function midiToFreq(m) { return 440.0 * Math.pow(2, (m - 69) / 12); }
  function midiToNoteName(m) {
    const rounded = Math.round(m);
    const pc = ((rounded % 12) + 12) % 12;
    const octave = Math.floor(rounded / 12) - 1;
    return NOTE_NAMES[pc] + octave;
  }

  // ============================================================
  // Note segmentation: turn a continuous f0 track into discrete
  // "blobs" (Melodyne-style), each holding a stable rounded MIDI
  // note plus the raw pitch curve inside it (for the wavy blob shape
  // and for shifting-while-preserving-vibrato on resynthesis).
  // ============================================================
  function segmentNotes(pitchTrack, opts) {
    opts = opts || {};
    const bridgeGapSec = opts.bridgeGapSec != null ? opts.bridgeGapSec : 0.09;
    const bridgeMaxSemitones = opts.bridgeMaxSemitones != null ? opts.bridgeMaxSemitones : 2.0;
    const boundaryThreshold = opts.boundaryThreshold != null ? opts.boundaryThreshold : 0.55;
    const minHoldSec = opts.minHoldSec != null ? opts.minHoldSec : 0.045;
    const minSegDurSec = opts.minSegDurSec != null ? opts.minSegDurSec : 0.06;
    const medianWin = opts.medianWin != null ? opts.medianWin : 5;

    const { times, f0s, voiced } = pitchTrack;
    const n = times.length;
    if (n === 0) return [];
    const hop = n > 1 ? times[1] - times[0] : 0.01;
    const minHoldFrames = Math.max(1, Math.round(minHoldSec / hop));

    // Raw midi per frame (NaN if unvoiced)
    const midiRaw = new Float64Array(n);
    for (let i = 0; i < n; i++) midiRaw[i] = voiced[i] ? freqToMidi(f0s[i]) : NaN;

    // Median-smooth voiced midi values to reject octave jumps / jitter
    // before boundary detection (segmentation only -- audio resynthesis
    // still uses the raw f0 curve).
    const midiSmooth = new Float64Array(n);
    const half = Math.floor(medianWin / 2);
    for (let i = 0; i < n; i++) {
      if (!voiced[i]) { midiSmooth[i] = NaN; continue; }
      const vals = [];
      for (let k = -half; k <= half; k++) {
        const j = i + k;
        if (j >= 0 && j < n && voiced[j]) vals.push(midiRaw[j]);
      }
      vals.sort((a, b) => a - b);
      midiSmooth[i] = vals[Math.floor(vals.length / 2)];
    }

    // Build voiced runs, bridging short unvoiced gaps when the pitch
    // either side is close (legato / brief consonant dropout).
    const runs = [];
    let i = 0;
    while (i < n) {
      if (!voiced[i]) { i++; continue; }
      let j = i;
      while (j < n) {
        if (voiced[j]) { j++; continue; }
        // gap: look ahead for the next voiced frame
        let k = j;
        while (k < n && !voiced[k]) k++;
        if (k < n) {
          const gapSec = times[k] - times[j - 1];
          const pitchDiff = Math.abs(midiSmooth[k] - midiSmooth[j - 1]);
          if (gapSec <= bridgeGapSec && pitchDiff <= bridgeMaxSemitones) { j = k; continue; }
        }
        break;
      }
      runs.push([i, j]); // [start, end) frame indices, may include a bridged unvoiced gap
      i = j;
    }

    // Within each run, split into note segments via hysteresis on the
    // rounded semitone the smoothed curve is centered on.
    const segments = [];
    for (const [rs, re] of runs) {
      let segStart = rs;
      let curCenter = Math.round(firstFinite(midiSmooth, rs, re));
      let holdStart = -1;
      let holdCenter = null;
      for (let idx = rs; idx < re; idx++) {
        const m = midiSmooth[idx];
        if (isNaN(m)) continue;
        const dev = m - curCenter;
        if (Math.abs(dev) > boundaryThreshold) {
          const candidateCenter = Math.round(m);
          if (holdCenter === candidateCenter) {
            if (holdStart >= 0 && (times[idx] - times[holdStart]) >= minHoldSec) {
              segments.push(makeSegment(segStart, holdStart, times, f0s, voiced, midiSmooth, curCenter));
              segStart = holdStart;
              curCenter = candidateCenter;
              holdStart = -1;
              holdCenter = null;
            }
          } else {
            holdCenter = candidateCenter;
            holdStart = idx;
          }
        } else {
          holdStart = -1;
          holdCenter = null;
        }
      }
      segments.push(makeSegment(segStart, re, times, f0s, voiced, midiSmooth, curCenter));
    }

    // Merge segments shorter than minSegDurSec into their neighbor.
    const merged = [];
    for (const seg of segments) {
      if (seg.durationSec < minSegDurSec && merged.length > 0) {
        const prev = merged[merged.length - 1];
        prev.endFrame = seg.endFrame;
        prev.endTime = seg.endTime;
        prev.durationSec = prev.endTime - prev.startTime;
      } else {
        merged.push(seg);
      }
    }
    merged.forEach((s, idx) => { s.id = idx; });
    return merged;
  }

  function firstFinite(arr, start, end) {
    for (let i = start; i < end; i++) if (!isNaN(arr[i])) return arr[i];
    return 60; // fallback: middle C
  }

  function makeSegment(startFrame, endFrame, times, f0s, voiced, midiSmooth, centerMidi) {
    const startTime = times[startFrame];
    const endTime = endFrame < times.length ? times[endFrame] : times[times.length - 1] + 0.01;
    // representative note = median of the smoothed midi within the segment
    const vals = [];
    for (let i = startFrame; i < endFrame; i++) if (!isNaN(midiSmooth[i])) vals.push(midiSmooth[i]);
    vals.sort((a, b) => a - b);
    const medianMidi = vals.length ? vals[Math.floor(vals.length / 2)] : centerMidi;
    return {
      startFrame, endFrame, startTime, endTime,
      durationSec: endTime - startTime,
      noteMidi: Math.round(medianMidi),
      medianMidi,
      shiftSemitones: 0,  // user edit: coarse drag, whole note ("Note tool")
      fineCents: 0,        // user edit: fine trim, whole note
      lineOffsets: null,   // user edit: free-hand curve reshape within the note ("Line tool"),
                           // a Float64Array of length (endFrame-startFrame) in semitones, lazily
                           // allocated on first paint; null/all-zero means "use the natural curve".
    };
  }

  // Recompute a segment's display stats (note name, median pitch) from the
  // raw f0 track -- used after a manual split, where the smoothed midi
  // array from segmentation isn't available anymore.
  function recomputeSegmentDisplay(seg, f0s, voiced) {
    const vals = [];
    for (let i = seg.startFrame; i < seg.endFrame; i++) if (voiced[i] && f0s[i] > 0) vals.push(freqToMidi(f0s[i]));
    vals.sort((a, b) => a - b);
    const medianMidi = vals.length ? vals[Math.floor(vals.length / 2)] : seg.medianMidi;
    seg.medianMidi = medianMidi;
    seg.noteMidi = Math.round(medianMidi);
  }

  // Split a segment into two at the given frame index (splitFrame becomes
  // the first frame of the new second half). Both halves start out with the
  // same shiftSemitones/fineCents as the original (so nothing audibly
  // changes at the moment of the split) and can then be edited independently.
  // lineOffsets, being frame-aligned, is sliced across the two halves.
  function splitSegment(segments, segId, splitFrame, times, f0s, voiced) {
    const seg = segments[segId];
    if (!seg) return segments;
    if (splitFrame <= seg.startFrame + 1 || splitFrame >= seg.endFrame - 1) return segments; // too close to an edge to be useful
    const first = Object.assign({}, seg, { endFrame: splitFrame, endTime: times[splitFrame] });
    const second = Object.assign({}, seg, { startFrame: splitFrame, startTime: times[splitFrame] });
    first.durationSec = first.endTime - first.startTime;
    second.durationSec = second.endTime - second.startTime;
    if (seg.lineOffsets) {
      first.lineOffsets = seg.lineOffsets.slice(0, splitFrame - seg.startFrame);
      second.lineOffsets = seg.lineOffsets.slice(splitFrame - seg.startFrame);
    }
    recomputeSegmentDisplay(first, f0s, voiced);
    recomputeSegmentDisplay(second, f0s, voiced);
    const out = segments.slice();
    out.splice(segId, 1, first, second);
    out.forEach((s, idx) => { s.id = idx; });
    return out;
  }

  // ============================================================
  // Reference/guide alignment: DTW-match a reference vocal's pitch
  // contour against the main vocal's, then read off what pitch the
  // reference is singing wherever a note segment falls, as a per-note
  // *suggestion* (never auto-applied -- the caller decides whether/how
  // to use it). This deliberately only ever touches PITCH, never timing:
  // the earlier DTW+WSOLA timing-correction attempt (see project notes)
  // never reached usable quality, so this route sidesteps it entirely --
  // segment start/end times are never modified by anything here.
  // ============================================================

  // Same median-smoothing segmentNotes uses for boundary detection,
  // factored out so it can also serve as the DTW alignment feature.
  function smoothedMidiSeq(pitchTrack, medianWin) {
    medianWin = medianWin || 5;
    const { f0s, voiced } = pitchTrack;
    const n = f0s.length;
    const midiRaw = new Float64Array(n);
    for (let i = 0; i < n; i++) midiRaw[i] = voiced[i] ? freqToMidi(f0s[i]) : NaN;
    const half = Math.floor(medianWin / 2);
    const out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      if (!voiced[i]) { out[i] = NaN; continue; }
      const vals = [];
      for (let k = -half; k <= half; k++) {
        const j = i + k;
        if (j >= 0 && j < n && voiced[j]) vals.push(midiRaw[j]);
      }
      vals.sort((a, b) => a - b);
      out[i] = vals[Math.floor(vals.length / 2)];
    }
    return out;
  }

  // Per-frame DTW cost: cheap match for silence-to-silence, a fixed
  // penalty for a voiced/unvoiced mismatch, and pitch distance (clamped
  // so a stray octave error doesn't dominate the whole alignment) when
  // both sides are voiced.
  function frameDist(a, b) {
    const va = !isNaN(a), vb = !isNaN(b);
    if (!va && !vb) return 0;
    if (va !== vb) return 6;
    return Math.min(12, Math.abs(a - b));
  }

  // Sakoe-Chiba-banded DTW: full O(n*m) DP is infeasible for a multi-
  // minute song at ~11ms frames (tens of thousands of frames per side),
  // so the search is restricted to a band around the diagonal (scaled by
  // the two sequences' relative lengths). This assumes the vocal and its
  // reference are roughly pre-aligned overall (similar lead-in, no huge
  // structural differences) -- a reasonable assumption for a guide/
  // reference take of the same song, but not a general-purpose aligner.
  // Returns the backtraced path as an array of [vocalFrameIdx, refFrameIdx].
  function dtwAlignPath(featA, featB, bandFrac) {
    const n = featA.length, m = featB.length;
    if (n === 0 || m === 0) return [];
    bandFrac = bandFrac || 0.12;
    const band = Math.max(30, Math.round(bandFrac * Math.max(n, m)));
    const ratio = m / n;
    const lo = new Int32Array(n), hi = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      const center = Math.round(i * ratio);
      lo[i] = Math.max(0, center - band);
      hi[i] = Math.min(m - 1, center + band);
    }
    const D = new Array(n), P = new Array(n);
    for (let i = 0; i < n; i++) {
      const width = hi[i] - lo[i] + 1;
      D[i] = new Float32Array(width);
      P[i] = new Uint8Array(width);
    }
    for (let i = 0; i < n; i++) {
      const width = hi[i] - lo[i] + 1;
      for (let jj = 0; jj < width; jj++) {
        const j = lo[i] + jj;
        const c = frameDist(featA[i], featB[j]);
        if (i === 0 && j === 0) { D[i][jj] = c; P[i][jj] = 0; continue; }
        let best = Infinity, dir = 0;
        if (i > 0 && j > 0 && j - 1 >= lo[i - 1] && j - 1 <= hi[i - 1]) {
          const v = D[i - 1][j - 1 - lo[i - 1]];
          if (v < best) { best = v; dir = 0; }
        }
        if (i > 0 && j >= lo[i - 1] && j <= hi[i - 1]) {
          const v = D[i - 1][j - lo[i - 1]];
          if (v < best) { best = v; dir = 1; }
        }
        if (jj > 0) {
          const v = D[i][jj - 1];
          if (v < best) { best = v; dir = 2; }
        }
        if (best === Infinity) best = 0; // outside predecessor band (rare edge case) -- treat as a fresh start
        D[i][jj] = best + c;
        P[i][jj] = dir;
      }
    }
    let i = n - 1;
    let j = Math.min(hi[n - 1], Math.max(lo[n - 1], m - 1));
    const path = [[i, j]];
    while (i > 0 || j > 0) {
      const jj = j - lo[i];
      const dir = P[i][jj];
      if (dir === 0) { i--; j--; }
      else if (dir === 1) { i--; }
      else { j--; }
      path.push([i, j]);
    }
    path.reverse();
    return path;
  }

  // Collapse the path into a strictly-increasing (vocalTime -> refTime)
  // map suitable for interpLin (duplicate vocal-time entries -- from a
  // run of "left" moves where several ref frames matched one vocal
  // frame -- are collapsed to their last ref time).
  function buildAlignmentTimeMap(vocalTimes, refTimes, path) {
    const xsTmp = [], ysTmp = [];
    for (let k = 0; k < path.length; k++) {
      const x = vocalTimes[path[k][0]], y = refTimes[path[k][1]];
      if (xsTmp.length > 0 && xsTmp[xsTmp.length - 1] === x) ysTmp[ysTmp.length - 1] = y;
      else { xsTmp.push(x); ysTmp.push(y); }
    }
    return { xs: Float64Array.from(xsTmp), ys: Float64Array.from(ysTmp) };
  }

  // Same as buildAlignmentTimeMap but keyed the other way (strictly
  // increasing reference time -> vocal time), for mapping a reference
  // playback position back onto the vocal timeline (e.g. to draw a
  // "here's where this is in the vocal" playhead while previewing the
  // reference).
  function buildReverseAlignmentTimeMap(vocalTimes, refTimes, path) {
    const xsTmp = [], ysTmp = [];
    for (let k = 0; k < path.length; k++) {
      const x = refTimes[path[k][1]], y = vocalTimes[path[k][0]];
      if (xsTmp.length > 0 && xsTmp[xsTmp.length - 1] === x) ysTmp[ysTmp.length - 1] = y;
      else { xsTmp.push(x); ysTmp.push(y); }
    }
    return { xs: Float64Array.from(xsTmp), ys: Float64Array.from(ysTmp) };
  }

  // Top-level entry point: for each vocal segment, find its time range's
  // counterpart in the reference (via the DTW time map) and report the
  // reference's median pitch there as a suggestion (null if the aligned
  // reference region has no voiced content). vocalSegments only needs
  // {startTime, endTime} per entry.
  // Subtract each track's own median voiced pitch before alignment, so a
  // constant register difference between the vocal and its reference (a
  // different singer, or the same singer transposed) can't create
  // spurious low-cost shortcuts in the DTW search -- what should drive
  // alignment is melodic CONTOUR (the shape of rises and falls), not
  // absolute pitch level. (The final suggestion readout below still uses
  // genuine absolute reference pitch, unaffected by this -- de-meaning is
  // only used to decide the TIME correspondence.)
  function demeanedSeq(seq) {
    const vals = [];
    for (let i = 0; i < seq.length; i++) if (!isNaN(seq[i])) vals.push(seq[i]);
    if (vals.length === 0) return seq;
    vals.sort((a, b) => a - b);
    const med = vals[Math.floor(vals.length / 2)];
    const out = new Float64Array(seq.length);
    for (let i = 0; i < seq.length; i++) out[i] = isNaN(seq[i]) ? NaN : seq[i] - med;
    return out;
  }

  // Returns { suggestions, alignXs, alignYs } -- the alignment time map is
  // handed back too (not just the per-segment suggestions) so the caller
  // can also convert an arbitrary vocal-timeline position to the
  // corresponding reference position, e.g. to play the reference back
  // from "wherever the main playhead currently is."
  function suggestFromReference(vocalPitchTrack, vocalSegments, refPitchTrack, opts) {
    opts = opts || {};
    const vocalFeat = demeanedSeq(smoothedMidiSeq(vocalPitchTrack, opts.medianWin));
    const refFeat = demeanedSeq(smoothedMidiSeq(refPitchTrack, opts.medianWin));
    const path = dtwAlignPath(vocalFeat, refFeat, opts.bandFrac);
    const { xs, ys } = buildAlignmentTimeMap(vocalPitchTrack.times, refPitchTrack.times, path);
    const { xs: refXs, ys: refYs } = buildReverseAlignmentTimeMap(vocalPitchTrack.times, refPitchTrack.times, path);
    const { times: refTimes, f0s: refF0s, voiced: refVoiced } = refPitchTrack;
    const suggestions = vocalSegments.map((seg) => {
      if (xs.length === 0) return null;
      const refStart = interpLin(seg.startTime, xs, ys);
      const refEnd = interpLin(seg.endTime, xs, ys);
      const lo = Math.min(refStart, refEnd), hi = Math.max(refStart, refEnd);
      const vals = [];
      for (let i = 0; i < refTimes.length; i++) {
        if (refTimes[i] < lo || refTimes[i] > hi) continue;
        if (refVoiced[i] && refF0s[i] > 0) vals.push(freqToMidi(refF0s[i]));
      }
      if (vals.length === 0) return null;
      vals.sort((a, b) => a - b);
      let target = vals[Math.floor(vals.length / 2)];
      // Snap to whichever octave of the reference's pitch sits closest to
      // the singer's OWN original note. A reference/guide track is very
      // often sung in a different register than the take being corrected
      // (a different singer, or a guide take sung down an octave) --
      // without this, a suggestion can come back a clean octave (or more)
      // off, which would suggest jumping the whole voice to a different
      // register instead of fixing the note within its own register.
      if (seg.noteMidi != null) {
        while (target - seg.noteMidi > 6) target -= 12;
        while (seg.noteMidi - target > 6) target += 12;
      }
      return target;
    });
    return { suggestions, alignXs: xs, alignYs: ys, alignRefXs: refXs, alignRefYs: refYs };
  }

  // ============================================================
  // Grain-schedule PSOLA
  //   Step 1: build the grain schedule once from the mono analysis
  //           + the current per-segment edits.
  //   Step 2: replay that schedule against any channel's samples.
  // This keeps stereo channels phase-locked (no comb filtering).
  // ============================================================

  function fillUnvoiced(f0s, voiced, defaultF0) {
    defaultF0 = defaultF0 || 150.0;
    const filled = Float64Array.from(f0s);
    let last = null;
    for (let i = 0; i < filled.length; i++) {
      if (voiced[i]) last = filled[i]; else if (last !== null) filled[i] = last;
    }
    let nxt = null;
    for (let i = filled.length - 1; i >= 0; i--) {
      if (voiced[i]) nxt = filled[i]; else if (filled[i] === 0 && nxt !== null) filled[i] = nxt;
    }
    for (let i = 0; i < filled.length; i++) if (filled[i] <= 0) filled[i] = defaultF0;
    return filled;
  }

  function interpLin(x, xp, fp) {
    const n = xp.length;
    if (n === 0) return 0;
    if (x <= xp[0]) return fp[0];
    if (x >= xp[n - 1]) return fp[n - 1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xp[mid] <= x) lo = mid; else hi = mid; }
    const t = (x - xp[lo]) / (xp[hi] - xp[lo]);
    return fp[lo] + t * (fp[hi] - fp[lo]);
  }

  function nearestFlag(t, times, flags) {
    if (times.length === 0) return false;
    let lo = 0, hi = times.length - 1;
    if (t <= times[0]) return !!flags[0];
    if (t >= times[hi]) return !!flags[hi];
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (times[mid] <= t) lo = mid; else hi = mid; }
    return !!flags[hi];
  }

  function hannWin(len) {
    const w = new Float64Array(len);
    for (let i = 0; i < len; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / Math.max(1, len - 1));
    return w;
  }

  function findSegmentAtTime(segments, t) {
    // segments are non-overlapping and sorted by startTime (segmentNotes builds them in order)
    for (let i = 0; i < segments.length; i++) {
      const s = segments[i];
      if (t >= s.startTime && t < s.endTime) return s;
    }
    return null;
  }

  // Free-hand "Line tool" offset (semitones) at time t within a segment,
  // interpolated from the user-painted lineOffsets array (frame-aligned to
  // this segment's own [startFrame,endFrame) slice of the shared times
  // array). 0 wherever nothing has been painted.
  function lineOffsetAt(seg, times, t) {
    if (!seg.lineOffsets || seg.lineOffsets.length === 0) return 0;
    const sub = times.subarray(seg.startFrame, seg.endFrame);
    return interpLin(t, sub, seg.lineOffsets);
  }

  // outTime is the master/output clock: it always advances from 0 to the
  // file duration, so total rendered length is correct BY CONSTRUCTION,
  // independent of any shift applied. sourceTime (where grain content is
  // read from) advances on its OWN accumulator, one native input period
  // (tInPeriod) per grain, sequentially through genuinely distinct cycles
  // of the source waveform -- that sequential-but-differently-paced
  // consumption relative to outTime's step (tOutPeriod = tInPeriod/ratio)
  // is what actually produces the pitch shift. Sequential accumulation
  // means sourceTime can run past the end of a large upward-shifted
  // segment before outTime does (a higher target pitch consumes native
  // cycles faster than real time can supply them from a fixed-length
  // source); rather than clamping (which freezes on the last sample --
  // an audible stutter), we WRAP sourceTime back into the segment's own
  // span so it keeps cycling through already-used-but-still-representative
  // content instead of repeating one frozen instant. sourceTime is
  // resynced to outTime the moment the active segment changes (including
  // between two segments with no gap between them), so drift never
  // carries into a neighboring note.
  function buildGrainSchedule(sr, n, pitchTrack, segments, opts) {
    opts = opts || {};
    const defaultF0 = opts.defaultF0 || 150.0;
    const { times, f0s, voiced } = pitchTrack;
    const filledF0 = fillUnvoiced(f0s, voiced, defaultF0);
    const tail = Math.floor(sr / 2);
    const outLen = n + tail;
    const minPeriod = 1.0 / 800.0, maxPeriod = 1.0 / 60.0;
    const grains = [];
    let outTime = 0.0;
    let sourceTime = 0.0;
    let curSeg = null;
    const duration = n / sr;
    while (outTime < duration) {
      const seg = findSegmentAtTime(segments, outTime);
      if (seg !== curSeg) { sourceTime = outTime; curSeg = seg; }
      if (seg) {
        const segDur = seg.endTime - seg.startTime;
        if (sourceTime > seg.endTime && segDur > 1e-6) {

        }

      } else {

      }

      if (f0Here <= 0) f0Here = defaultF0;
      let tInPeriod = 1.0 / f0Here;
      tInPeriod = Math.min(Math.max(tInPeriod, minPeriod), maxPeriod);

      let ratio = 1.0;
      if (vHere && seg) {
        const shiftSemi = seg.shiftSemitones + seg.fineCents / 100 + lineOffsetAt(seg, times, sourceTime);

        ratio = Math.min(Math.max(ratio, 0.5), 2.0);
      }
      const tOutPeriod = tInPeriod / ratio;

      const srcCenter = Math.round(sourceTime * sr);
      const half = Math.round(tInPeriod * sr);
      const start = Math.max(0, srcCenter - half);
      const end = Math.min(n, srcCenter + half);
      if (end - start >= 8) {
        const grainLen = end - start;
        const outCenter = Math.round(outTime * sr);
        let oStart = outCenter - (srcCenter - start);
        let oEnd = oStart + grainLen;
        let gLo = 0, gHi = grainLen;
        if (oStart < 0) { gLo = -oStart; oStart = 0; }

  // WAV encode (24-bit PCM, interleaved multi-channel)
  // 24-bit export avoids making the editor itself the final quantization bottleneck.
  // TPDF dither is applied at the 24-bit LSB before quantization.
  function encodeWav(channels, sr) {
    const numCh = channels.length;
    const len = channels[0].length;
    const bytesPerSample = 3;
    const dataBytes = len * numCh * bytesPerSample;
    const buffer = new ArrayBuffer(44 + dataBytes);
    const view = new DataView(buffer);
    function writeStr(off, str) { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); }
    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataBytes, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM integer
    view.setUint16(22, numCh, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * numCh * bytesPerSample, true);
    view.setUint16(32, numCh * bytesPerSample, true);
    view.setUint16(34, 24, true);
    writeStr(36, 'data');
    view.setUint32(40, dataBytes, true);

        if (v > max24) v = max24;
        if (v < min24) v = min24;
        if (v < 0) v += 0x1000000;
        view.setUint8(offset++, v & 0xff);
        view.setUint8(offset++, (v >> 8) & 0xff);
        view.setUint8(offset++, (v >> 16) & 0xff);
